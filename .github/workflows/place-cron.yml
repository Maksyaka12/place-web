# Place cron tick (indexer, keeper, rewards publisher, snapshots): FALLBACK scheduler.
# The main one is an external scheduler calling /api/place-cron?async=1 every 5 minutes (docs/CRON.md); Vercel
# Hobby runs it once a day (vercel.json, 00:05 UTC). GitHub delays scheduled workflows a lot (in practice every
# 8-16 hours), so this only covers the case where the external scheduler is down. Overlapping calls are safe: the
# endpoint runs one tick at a time (lease) and answers { skipped } to the others.
#
# Needs in GitHub → Settings → Secrets and variables → Actions:
#   secret   CRON_SECRET  the same value as CRON_SECRET in the Vercel project
#   variable PLACE_URL    the site, e.g. https://place-blond.vercel.app (no trailing slash)
name: Place cron

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: place-cron
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Run /api/place-cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PLACE_URL: ${{ vars.PLACE_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$PLACE_URL" ]; then
            echo "Set the CRON_SECRET secret and the PLACE_URL variable first" >&2
            exit 1
          fi
          code=$(curl -sS -o result.json -w '%{http_code}' --max-time 320 \
            -H "Authorization: Bearer $CRON_SECRET" "$PLACE_URL/api/place-cron")
          cat result.json; echo
          test "$code" = "200"
