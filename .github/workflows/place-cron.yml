# Place indexer and snapshot service tick. Vercel Hobby allows a cron only once a day, so the
# frequent tick comes from here: every 30 minutes (Actions minutes are free for this public repository). Snapshots have 72 h to publish, so this is plenty on testnet; on Vercel Pro the
# schedule moves back to vercel.json (every minute) and this workflow can be removed.
#
# Needs in GitHub → Settings → Secrets and variables → Actions:
#   secret   CRON_SECRET  the same value as CRON_SECRET in the Vercel project
#   variable PLACE_URL    the site, e.g. https://place-blond.vercel.app (no trailing slash)
name: Place cron

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: place-cron
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Run /api/place-cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PLACE_URL: ${{ vars.PLACE_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$PLACE_URL" ]; then
            echo "Set the CRON_SECRET secret and the PLACE_URL variable first" >&2
            exit 1
          fi
          code=$(curl -sS -o result.json -w '%{http_code}' --max-time 320 \
            -H "Authorization: Bearer $CRON_SECRET" "$PLACE_URL/api/place-cron")
          cat result.json; echo
          test "$code" = "200"
